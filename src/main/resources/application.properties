# Item source (official data dump repository)
item_catalog_url=https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json

# Albion Online Data API
prices_base_url=https://www.albion-online-data.com/api/v2/stats/prices

cities=Bridgewatch,Martlock,Thetford,Lymhurst,FortSterling,Caerleon
qualities=1,2,3,4,5
include_enchantments=0,1,2,3

concurrency=6
chunk_size=100
max_retries=5
request_timeout_seconds=30
requests_per_second=8

output_csv_path=./output/prices.csv
sqlite_db_path=./output/prices.db

# Optional filter: keep only price rows whose latest buy/sell timestamp is within X minutes
# since_minutes=120
